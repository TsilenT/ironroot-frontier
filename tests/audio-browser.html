<!doctype html><title>Ironroot audio compatibility</title><h1>Ironroot audio compatibility</h1><button id="unlock">Unlock and start</button><button id="musicOff">Music off</button><button id="musicOn">Music on</button><button id="sfxOff">SFX off</button><button id="sfxOn">SFX on</button><button id="mute">Mute all</button><button id="unmute">Unmute all</button><button id="zero">Volume zero</button><button id="max">Volume max</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="render">Render offline tests</button><button id="destroy">Destroy</button><pre id="state"></pre><pre id="results"></pre><script type="module">
import {GameAudio} from '../dist/audio.js';
import {renderScenario} from '../qa/audio/render.mjs';
const out=document.getElementById('state'),results=document.getElementById('results');
const audio=new GameAudio({muted:false});
const report=()=>out.textContent=JSON.stringify(audio.getState(),null,2);
function button(id,fn){document.getElementById(id).onclick=async()=>{try{await fn();report();}catch(e){results.textContent='FAIL '+e.stack;}};}
button('unlock',async()=>{await audio.unlock();audio.setScene('battle');audio.play('start');});
button('musicOff',()=>audio.setMusicEnabled(false));button('musicOn',()=>audio.setMusicEnabled(true));
button('sfxOff',()=>{audio.setSfxEnabled(false);audio.play('strike');});button('sfxOn',()=>{audio.setSfxEnabled(true);audio.play('strike');});
button('mute',()=>audio.setMuted(true));button('unmute',()=>audio.setMuted(false));
button('zero',()=>audio.setVolume(0));button('max',()=>audio.setVolume(1));
button('pause',()=>audio.setScene('paused'));button('resume',()=>audio.setScene('battle'));
button('destroy',()=>audio.destroy());
async function render(kind){
  const scenario={music:'battle',sfx:'cues',mix:'stress',muted:'muted'}[kind];
  const result=await renderScenario(scenario,{sampleRate:24000});
  return {...result.metrics,...(result.cues?{cues:result.cues}:{})};
}
button('render',async()=>{results.textContent='Rendering original score and every cue...';const data={browser:navigator.userAgent,music:await render('music'),sfx:await render('sfx'),stressMix:await render('mix'),muted:await render('muted')};data.pass=data.music.rms>0&&data.sfx.cues.every(c=>c.rms>0)&&data.stressMix.clipped===0&&data.muted.peak===0;results.textContent=JSON.stringify(data,null,2);});
report();setInterval(report,250);
</script>
