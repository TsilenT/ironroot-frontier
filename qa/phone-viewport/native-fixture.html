<!doctype html><meta charset="utf-8"><title>Private phone viewport QA</title>
<style>body{margin:8px;background:#eee;font:14px system-ui}button,select,input{font:inherit;padding:5px;margin:3px}iframe{flex:none;border:0;display:block;background:#14251e}#row{display:flex;align-items:start;gap:12px}pre{font:12px monospace;white-space:pre-wrap;width:560px;flex:none;max-height:690px;overflow:auto}#status{margin:6px}</style>
<h2>Private phone viewport QA</h2><p>Actual game assets in a responsive iframe. Storage is isolated in memory before app startup. No shared profile writes.</p>
<label>Viewport <select id="size"><option>320x480</option><option>360x640</option><option>390x650</option><option>393x700</option><option>667x375</option><option>740x320</option><option>844x390</option><option>915x412</option><option>390x560</option><option>667x300</option><option>390x430</option><option>1200x700</option><option>320x300</option><option>667x240</option><option>280x430</option></select></label><label>Memory profile <select id="profile"><option value="empty">Empty</option><option value="campaign">Synthetic campaign unlocked</option></select></label><button id="load">Load fresh game</button><button id="resize">Resize existing game</button><button id="measure">Measure rendered game</button><button id="verify">Verify shared profile unchanged</button><label>Synthetic visual viewport <select id="visual"><option value="native">Native</option><option value="clip">Clip 50px bottom</option><option value="offset">Offset top 1px</option><option value="both">Clip 50px, offset top 10px</option></select></label><button id="applyvisual">Apply synthetic viewport</button><label>Synthetic insets <select id="insets"><option value="none">None</option><option value="portrait">Portrait top24 bottom20</option><option value="landscape">Landscape left24 right24 bottom16</option></select></label><button id="applyinsets">Apply synthetic insets</button><label>Synthetic target labels <select id="labels"><option value="lost">Original missing</option><option value="critical">20% HP critical</option></select></label><button id="renderlabels">Render static label test</button><button id="export">Export measurements</button>
<p id="status" role="status">Not loaded.</p><div id="row"><iframe id="game" title="Game viewport" allow="fullscreen"></iframe><pre id="report"></pre></div>
<script type="module">
import {CAMPAIGN_MISSIONS} from './campaign.js';
import {inspectMobileGeometry,visibleViewportRect} from './mobile-battlefield.js';
const $=id=>document.getElementById(id), records=[];
const read=()=>Object.fromEntries(Object.keys(localStorage).sort().map(k=>[k,localStorage.getItem(k)]));
const original=JSON.stringify(read());
const sha=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))).map(x=>x.toString(16).padStart(2,'0')).join('');
const gameOriginal=JSON.stringify(Object.fromEntries(Object.entries(JSON.parse(original)).filter(([k])=>k.startsWith('ironroot.'))));
const originalHash=await sha(gameOriginal);
$('status').textContent='Shared profile capture (read-only): '+Object.keys(JSON.parse(gameOriginal)).length+' game keys, SHA-256 '+originalHash;
function resize(){const [w,h]=$('size').value.split('x').map(Number);$('game').style.width=w+'px';$('game').style.height=h+'px';}
$('load').onclick=async()=>{resize();const source=await(await fetch('./index.html')).text();const isolation=`<base href="${location.origin}/"><script>(()=>{const make=()=>{const m=new Map;return {getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>m.set(String(k),String(v)),removeItem:k=>m.delete(String(k)),clear:()=>m.clear(),key:i=>[...m.keys()][i]??null,get length(){return m.size}}};Object.defineProperty(window,'localStorage',{value:make()});Object.defineProperty(window,'sessionStorage',{value:make()});const real=window.visualViewport;const v=new EventTarget();let clip=0,offset=0;Object.defineProperties(v,{width:{get:()=>real.width},height:{get:()=>real.height-clip},offsetTop:{get:()=>offset},offsetLeft:{get:()=>real.offsetLeft},scale:{get:()=>1},pageTop:{get:()=>offset},pageLeft:{get:()=>0}});Object.defineProperty(window,'visualViewport',{value:v});window.__qaSetVisual=(mode)=>{clip=mode==='clip'||mode==='both'?50:0;offset=mode==='offset'?1:mode==='both'?10:0;v.dispatchEvent(new Event('resize'));v.dispatchEvent(new Event('scroll'));};})();<\/script>`; const seeded=$('profile').value==='campaign'?'<script>localStorage.setItem("ironroot.campaign.v1",'+JSON.stringify(JSON.stringify({format:'ironroot-campaign',version:1,missions:Object.fromEntries(CAMPAIGN_MISSIONS.map(m=>[m.id,{completed:true,stars:1,bestTime:Math.min(100,m.timeLimit)}]))}))+');<\/script>':'';$('game').srcdoc=source.replace('<head>','<head>'+isolation+seeded);$('status').textContent='Fresh isolated game loading at '+$('size').value;};
$('resize').onclick=()=>{resize();$('status').textContent='Existing game resized to '+$('size').value;};
$('applyvisual').onclick=()=>{$('game').contentWindow.__qaSetVisual($('visual').value);$('status').textContent='Synthetic visual viewport applied: '+$('visual').value;};
$('applyinsets').onclick=()=>{const a=$('game').contentDocument.getElementById('app'),m=$('insets').value;for(const [side,val]of Object.entries(m==='portrait'?{top:24,bottom:20,left:0,right:0}:m==='landscape'?{top:0,bottom:16,left:24,right:24}:{top:0,bottom:0,left:0,right:0}))a.style.setProperty('--mobile-inset-'+side,val+'px');$('game').contentWindow.dispatchEvent(new Event('resize'));$('status').textContent='Synthetic safe-area CSS insets: '+m;};
$('renderlabels').onclick=()=>{const doc=$('game').contentDocument.documentElement.cloneNode(true);doc.querySelectorAll('script').forEach(e=>e.remove());for(const id of ['pauseVeil','viewportModal'])doc.querySelector('#'+id)?.classList.add('hidden');const state=$('labels').value;for(const b of doc.querySelectorAll('#protectedTargets button')){b.dataset.state=state;b.disabled=state==='lost';b.querySelector('.protected-health').textContent=state==='lost'?'Original missing':'20% HP · Critical';b.querySelector('.protected-health').setAttribute('aria-label',state==='lost'?'Original structure missing; health unavailable.':'76 of 380 health. critical.');} $('game').srcdoc='<!doctype html>'+doc.outerHTML;$('status').textContent='SYNTHETIC STATIC LABEL TEST: '+state+'; app scripts removed, no simulation or profile changes';};
const rr=e=>{const r=e.getBoundingClientRect();return {id:e.id||e.dataset.targetId||e.className,label:e.getAttribute('aria-label')||e.textContent?.trim().slice(0,75),left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height,visible:!!e.getClientRects().length}};
$('measure').onclick=()=>{const w=$('game').contentWindow,d=w.document;const by=id=>d.getElementById(id),viewport=visibleViewportRect(w.innerWidth,w.innerHeight,w.visualViewport);const controlIds=['pause','speed','sound','settings','home','front','minimap','compactBuild'];const controls=[...controlIds.map(by),...d.querySelectorAll('#protectedTargets button')].filter(Boolean).map(rr);const regions=['topbar','protectedDock','protectedNavigation'].map(id=>rr(by(id)));const canvas=rr(by('battle'));const geometry=inspectMobileGeometry({viewport,canvas,regions,controls});const record={at:new Date().toISOString(),size:$('size').value,syntheticVisual:$('visual').value,syntheticInsets:$('insets').value,viewport,appClass:by('app').className,canvas,regions,controls,geometry,modal:{visible:!by('viewportModal').classList.contains('hidden'),title:by('viewportTitle').textContent,reason:by('viewportReason').textContent,resumeDisabled:by('viewportResume').disabled},time:by('time').textContent,hudText:['gold','income','army','time','objectiveIdentity','objectiveProgress','objectiveTime','yourHpText','enemyHpText'].map(id=>({id,text:by(id)?.textContent,rect:by(id)?rr(by(id)):null})),textNodes:[...d.querySelectorAll('#protectedTargets .protected-name,#protectedTargets .protected-health,#protectedTargets .protected-focus-hint,#protectedTargets .protected-status,.base-status span')].map(rr),scroll:{width:d.documentElement.scrollWidth,height:d.documentElement.scrollHeight},localStorageIsMemory:w.localStorage!==localStorage,sharedProfileExact:original===JSON.stringify(read())};records.push(record);$('report').textContent=JSON.stringify(record,null,2);$('status').textContent=record.size+': '+JSON.stringify(geometry)+'; modal='+record.modal.visible;};
$('verify').onclick=async()=>{$('report').textContent=JSON.stringify({allSharedKeysExact:original===JSON.stringify(read()),gameKeys:Object.keys(JSON.parse(gameOriginal)),originalGameSHA256:originalHash,currentGameSHA256:await sha(JSON.stringify(Object.fromEntries(Object.entries(read()).filter(([k])=>k.startsWith('ironroot.')))))},null,2);};
$('export').onclick=()=>{const a=document.createElement('a');a.download='phone-native-measurements.json';a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.click();};
</script>
